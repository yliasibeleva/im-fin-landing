<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Империя Финанс{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body{background:#f4f6fb;font-size:.92rem}
    .navbar{background:#1a3a5c!important}
    .navbar-brand{font-weight:700;color:#fff!important}
    .nav-link{color:rgba(255,255,255,.8)!important}
    .nav-link:hover,.nav-link.active{color:#fff!important}
    .card{border:none;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
    .card-header{border-radius:12px 12px 0 0!important;font-weight:600}
    .stat-card{border-left:4px solid}
    .stat-card.blue{border-color:#0d6efd}.stat-card.green{border-color:#198754}
    .stat-card.red{border-color:#dc3545}.stat-card.orange{border-color:#fd7e14}
    .badge-usn{background:#d1ecf1;color:#0c5460}.badge-osn{background:#fff3cd;color:#856404}
    .badge-esxn{background:#d4edda;color:#155724}.badge-psn{background:#e2d9f3;color:#432874}
    .badge-ooo{background:#cfe2ff;color:#084298}.badge-ip{background:#f8d7da;color:#842029}
    .table th{background:#f1f4f9;font-size:.82rem;text-transform:uppercase;letter-spacing:.4px}
    .dl-overdue{background:#fff5f5}.dl-soon{background:#fffbf0}
    .section-title{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#6c757d;margin-bottom:.5rem}
    .btn-xs{padding:.15rem .5rem;font-size:.78rem}
    textarea.form-control{resize:vertical}
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/"><i class="bi bi-building-fill me-2"></i>Империя Финанс</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2 me-1"></i>Дашборд</a></li>
        <li class="nav-item"><a class="nav-link" href="/reports"><i class="bi bi-clipboard2-check me-1"></i>Отчётность</a></li>
        <li class="nav-item"><a class="nav-link" href="/deadlines"><i class="bi bi-calendar-check me-1"></i>Дедлайны</a></li>
        <li class="nav-item"><a class="nav-link" href="/tasks"><i class="bi bi-list-task me-1"></i>Задачи</a></li>
        <li class="nav-item"><a class="nav-link" href="/works"><i class="bi bi-briefcase me-1"></i>Допы</a></li>
        <li class="nav-item"><a class="nav-link" href="/errors"><i class="bi bi-bug me-1"></i>Ошибки</a></li>
        <li class="nav-item"><a class="nav-link" href="/kpi"><i class="bi bi-bar-chart-fill me-1"></i>KPI</a></li>
        <li class="nav-item"><a class="nav-link" href="/accountants"><i class="bi bi-people-fill me-1"></i>Бухгалтеры</a></li>
        <li class="nav-item"><a class="nav-link" href="/export/excel"><i class="bi bi-file-earmark-excel me-1"></i>Excel</a></li>
      </ul>
      <span class="navbar-text ms-3 text-white-50"><i class="bi bi-calendar3 me-1"></i>{{ today }}</span>
    </div>
  </div>
</nav>
<div class="container-fluid px-4">{% block content %}{% endblock %}</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
